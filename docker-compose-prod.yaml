version: '3.8'

services:
  postgres:
    image: 'postgres:16.4'
    restart: always
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-n8n}'
      - 'POSTGRES_USER=${POSTGRES_USER:-n8n}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-n8n}'
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: 'n8nio/n8n:latest'
    restart: always
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - 'DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}'
      - 'DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}'
      - 'DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}'
      - 'N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}'
      - 'N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}'
      - 'N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}'
      - 'WEBHOOK_URL=${WEBHOOK_URL}'
      - 'N8N_HOST=${N8N_HOST}'
      - N8N_PORT=5678
      - 'N8N_PROTOCOL=${N8N_PROTOCOL:-https}'
      - 'N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}'
      - 'N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}'
      - 'N8N_METRICS=${N8N_METRICS:-true}'
      - N8N_USER_FOLDER=/home/node/.n8n
      - 'N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}'
      - 'N8N_JWT_AUTH_HEADER=${N8N_JWT_AUTH_HEADER}'
      - 'N8N_JWT_AUTH_HEADER_VALUE=${N8N_JWT_AUTH_HEADER_VALUE}'
    ports:
      - '5678:5678'
    volumes:
      - 'n8n_data:/home/node/.n8n'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --spider -q http://localhost:5678/healthz || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx reverse proxy for SSL
  # nginx:
  #   image: nginx:alpine
  #   restart: always
  #   ports:
  #     - "5678:5678"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - n8n

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
